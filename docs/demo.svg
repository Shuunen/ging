      @keyframes txBh{0%,30%{fill:#cbd5e1;opacity:1}34%,57%{fill:#fff;opacity:1}60%,93%{fill:#fff;opacity:0}96%,100%{fill:#fff;opacity:1}}
      @keyframes edIn{0%,57%{opacity:0}60%,93%{opacity:1}96%,100%{opacity:0}}
      @keyframes edOut{0%,57%{opacity:1}60%,93%{opacity:0}96%,100%{opacity:1}}
      @keyframes cur{0%,16%{transform:translate(660px,480px);opacity:0}20%{transform:translate(660px,480px);opacity:1}29%,37%{transform:translate(270px,300px);opacity:1}54%,62%{transform:translate(622px,26px);opacity:1}74%{transform:translate(430px,440px);opacity:1}90%,100%{transform:translate(430px,440px);opacity:0}}
      @keyframes rip1{0%,30%{opacity:0;transform:scale(.2)}31%{opacity:.8;transform:scale(.4)}37%,100%{opacity:0;transform:scale(1.4)}}
      @keyframes rip2{0%,55%{opacity:0;transform:scale(.2)}56%{opacity:.8;transform:scale(.4)}62%,100%{opacity:0;transform:scale(1.4)}}
      @keyframes cap1{0%,2%{opacity:0}5%,26%{opacity:1}30%,100%{opacity:0}}
      @keyframes cap2{0%,31%{opacity:0}35%,50%{opacity:1}54%,100%{opacity:0}}
      @keyframes cap3{0%,57%{opacity:0}61%,92%{opacity:1}95%,100%{opacity:0}}
    </style>
