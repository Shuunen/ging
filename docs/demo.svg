<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img" aria-label="GING demo: switching between projects, then editing a step">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a1a33"/><stop offset=".55" stop-color="#2a1050"/><stop offset="1" stop-color="#050a5a"/></linearGradient>
    <clipPath id="rc"><rect width="800" height="584" rx="12"/></clipPath>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .scene,.cur,.rip,.cap,.onA,.onB,.show-edit,.hide-edit,.txA,.txB,.txBh,.eb{animation-duration:18s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
      .scene{animation-name:scene}
      .onA{animation-name:onA} .onB{animation-name:onB}
      .txA{animation-name:txA} .txBh{animation-name:txBh} .txB{animation-name:txB}
      .show-edit,.eb{animation-name:edIn;opacity:0}
      .hide-edit{animation-name:edOut}
      .cur{animation-name:cur}
      .rip{transform-box:fill-box;transform-origin:center;opacity:0}
      .r1{animation-name:rip1} .r2{animation-name:rip2}
      .c1{animation-name:cap1;opacity:0} .c2{animation-name:cap2;opacity:0} .c3{animation-name:cap3;opacity:0}
      @keyframes scene{0%{opacity:0}3%,95%{opacity:1}100%{opacity:0}}
      @keyframes onA{0%,30%{opacity:1}34%,100%{opacity:0}}
      @keyframes onB{0%,30%{opacity:0}34%,100%{opacity:1}}
      @keyframes txA{0%,30%{fill:#fff}34%,100%{fill:#cbd5e1}}
